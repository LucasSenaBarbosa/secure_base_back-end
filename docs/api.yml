      operationId: get_solution_api_v1_homes__home_id__optimization_runs__run_id__solutions__solution_id__get
      security:
      - bearerAuth: []
      parameters:
      - name: home_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: solution_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolutionDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/homes/{home_id}/optimization-runs/{run_id}/compare:
    post:
      tags:
      - optimization
      summary: Comparar configuração manual com as soluções
      description: Avalia a configuração manual com o mesmo layout da execução e indica, para cada solução,
        as diferenças e a relação de dominância de Pareto.
      operationId: compare_api_v1_homes__home_id__optimization_runs__run_id__compare_post
      security:
      - bearerAuth: []
      parameters:
      - name: home_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompareRequest'
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comparison'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/homes/{home_id}/manual-configurations:
    get:
      tags:
      - optimization
      summary: Listar configurações manuais
      description: As métricas são recalculadas contra o layout salvo atual.
      operationId: list_manual_configurations_api_v1_homes__home_id__manual_configurations_get
      security:
      - bearerAuth: []
      parameters:
      - name: home_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManualConfiguration'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - optimization
      summary: Salvar configuração manual
      operationId: create_manual_configuration_api_v1_homes__home_id__manual_configurations_post
      security:
      - bearerAuth: []
      parameters:
      - name: home_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualConfigurationRequest'
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualConfiguration'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/homes/{home_id}/manual-configurations/{configuration_id}:
    delete:
      tags:
      - optimization
      summary: Remover configuração manual
      operationId: delete_manual_configuration_api_v1_homes__home_id__manual_configurations__configuration_id__delete
      security:
      - bearerAuth: []
      parameters:
      - name: home_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: configuration_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          $ref: '#/components/responses/Problem'
        '204':
          description: Successful Response
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chave aleatória e estável durante retries; retenção de 24 horas.
      schema:
        type: string
        minLength: 16
        maxLength: 200
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Mesmo valor presente no cookie `securebase-csrf`.
      schema:
        type: string
    CsrfTokenOptional:
      name: X-CSRF-Token
      in: header
      required: false
      description: Obrigatório quando o cookie `securebase-refresh` está presente.
      schema:
        type: string
    HomeId:
      name: home_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT HS256 da API SecureBase; informe somente o token.
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    AddHomeMember:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    CreateHome:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
    HomeProfile:
      type: object
      additionalProperties: false
      required: [id, name, primary_user_id, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        primary_user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [master, primary, member]
    TransferHomePrimary:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        name:
          type: string
          minLength: 2
          maxLength: 120
    RegisterResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Conta criada. Você já pode entrar.
    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in, user, csrf_token]
      properties:
        access_token:
          type: string
          description: JWT HS256 emitido e validado pela API SecureBase.
        token_type:
          type: string
          const: bearer
        expires_in:
          type: integer
          minimum: 1
        user:
          $ref: "#/components/schemas/UserProfile"
        csrf_token:
          type: string
          description: Token CSRF para enviar no cabeçalho durante refresh e logout.
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    UserProfile:
      type: object
      additionalProperties: false
      required: [id, email, name, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [master, primary, member]
    CandidatePoint:
      properties:
        id:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,47}$
        name:
          type: string
          maxLength: 80
          minLength: 1
        room_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,47}$
        position:
          prefixItems:
          - type: number
            maximum: 50.0
            minimum: -50.0
          - type: number
            maximum: 50.0
            minimum: -50.0
          - type: number
            maximum: 50.0
            minimum: -50.0
          type: array
          maxItems: 3
          minItems: 3
        allowed_sensor_type_ids:
          items:
            type: string
            pattern: ^[a-z0-9][a-z0-9_-]{0,47}$
          type: array
          maxItems: 20
          minItems: 1
        extra_installation_cost:
          type: number
          maximum: 10000000.0
          minimum: 0.0
          default: 0
        direction:
          anyOf:
          - prefixItems:
            - type: number
              maximum: 50.0
              minimum: -50.0
            - type: number
              maximum: 50.0
              minimum: -50.0
            - type: number
              maximum: 50.0
              minimum: -50.0
            type: array
            maxItems: 3
            minItems: 3
          - type: 'null'
          description: Direção do sensor direcional. Quando ausente, aponta para o centro do ambiente.
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - room_id
      - position
      - allowed_sensor_type_ids
    CompareRequest:
      properties:
        manual_configuration_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        sensors:
          anyOf:
          - items:
              $ref: '#/components/schemas/SensorPlacement'
            type: array
            maxItems: 200
          - type: 'null'
      additionalProperties: false
      type: object
    Comparison:
      properties:
        run_id:
          type: string
          format: uuid
        manual:
          $ref: '#/components/schemas/Evaluation'
        manual_is_dominated:
          type: boolean
          description: Verdadeiro se ao menos uma solução calculada domina a configuração manual.
        entries:
          items:
            $ref: '#/components/schemas/ComparisonEntry'
          type: array
      type: object
      required:
      - run_id
      - manual
      - manual_is_dominated
      - entries
    ComparisonEntry:
      properties:
        solution_id:
          type: string
          format: uuid
        index:
          type: integer
        metrics:
          $ref: '#/components/schemas/Metrics'
        delta_coverage:
          type: number
          description: Solução − manual.
        delta_cost:
          type: number
          description: Solução − manual.
        delta_vulnerability:
          type: number
          description: Solução − manual.
        solution_dominates_manual:
          type: boolean
        manual_dominates_solution:
          type: boolean
      type: object
      required:
      - solution_id
      - index
      - metrics
      - delta_coverage
      - delta_cost
      - delta_vulnerability
      - solution_dominates_manual
      - manual_dominates_solution
    CriticalPoint:
      properties:
        id:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,47}$
        name:
          type: string
          maxLength: 80
          minLength: 1
        room_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,47}$
        position:
          prefixItems:
          - type: number
            maximum: 50.0
            minimum: -50.0
          - type: number
            maximum: 50.0
            minimum: -50.0
          - type: number
            maximum: 50.0
            minimum: -50.0
          type: array
          maxItems: 3
          minItems: 3
        importance:
          type: integer
          maximum: 5.0
          minimum: 1.0
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - room_id
      - position
      - importance
    Evaluation:
      properties:
        layout_version:
          type: integer
        metrics:
          $ref: '#/components/schemas/Metrics'
        feasible:
          type: boolean
        violations:
          items:
            $ref: '#/components/schemas/Violation'
          type: array
        points:
          items:
            $ref: '#/components/schemas/PointCoverage'
          type: array
      type: object
      required:
      - layout_version
      - metrics
      - feasible
      - violations
      - points
    EvaluationRequest:
      properties:
        sensors:
          items:
            $ref: '#/components/schemas/SensorPlacement'
          type: array
          maxItems: 200
      additionalProperties: false
      type: object
      required:
      - sensors
    HomeLayout:
      properties:
        budget:
          anyOf:
          - type: number
            maximum: 10000000.0
            minimum: 0.0
          - type: 'null'
          description: Orçamento máximo. Obrigatório para avaliar ou otimizar.
        coverage_threshold:
          type: number
          maximum: 1.0
          exclusiveMinimum: 0.0
          description: Probabilidade mínima de detecção para um ponto contar como coberto.
          default: 0.8
        rooms:
          items:
            $ref: '#/components/schemas/Room'
          type: array
          maxItems: 50
          minItems: 1
        critical_points:
          items:
            $ref: '#/components/schemas/CriticalPoint'
          type: array
          maxItems: 300
          minItems: 1
        candidate_points:
          items:
            $ref: '#/components/schemas/CandidatePoint'
          type: array
          maxItems: 200
          minItems: 1
        sensor_types:
          items:
            $ref: '#/components/schemas/SensorType'
          type: array
          maxItems: 20
          minItems: 1
      additionalProperties: false
      type: object
      required:
      - rooms
      - critical_points
      - candidate_points
      - sensor_types
    LayoutDocument:
      properties:
        home_id:
          type: string
          format: uuid
        source:
          type: string
          enum:
          - saved
          - template
        version:
          type: integer
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        layout:
          $ref: '#/components/schemas/HomeLayout'
      type: object
      required:
      - home_id
      - source
      - version
      - updated_at
      - layout
    ManualConfiguration:
      properties:
        id:
          type: string
          format: uuid
        home_id:
          type: string
          format: uuid
        name:
          type: string
        sensors:
          items:
            $ref: '#/components/schemas/SensorPlacement'
          type: array
        created_at:
          type: string
          format: date-time
        created_by:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        evaluation:
          anyOf:
          - $ref: '#/components/schemas/Evaluation'
          - type: 'null'
          description: Métricas calculadas contra o layout salvo atual.
        evaluation_error:
          anyOf:
          - type: string
          - type: 'null'
          description: Motivo de não haver avaliação (layout incompleto ou ponto removido).
      type: object
      required:
      - id
      - home_id
      - name
      - sensors
      - created_at
      - created_by
      - evaluation
    ManualConfigurationRequest:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
        sensors:
          items:
            $ref: '#/components/schemas/SensorPlacement'
          type: array
          maxItems: 200
      additionalProperties: false
      type: object
      required:
      - name
      - sensors
    Metrics:
      properties:
        coverage:
          type: number
          description: Fração dos pontos críticos cobertos (0–1).
        cost:
          type: number
          description: 'Custo total: aquisição + instalação.'
        vulnerability:
          type: number
          description: Vulnerabilidade residual ponderada pela importância (0–1).
        sensor_count:
          type: integer
        sensors_by_type:
          additionalProperties:
            type: integer
          type: object
      type: object
      required:
      - coverage
      - cost
      - vulnerability
      - sensor_count
      - sensors_by_type
    OptimizationRunRequest:
      properties:
        population_size:
          type: integer
          maximum: 200.0
          minimum: 10.0
          default: 60
        generations:
          type: integer
          maximum: 300.0
          minimum: 1.0
          default: 100
        seed:
          anyOf:
          - type: integer
            maximum: 2147483647.0
            minimum: 0.0
          - type: 'null'
          description: Semente para reprodutibilidade; gerada e retornada quando ausente.
      additionalProperties: false
      type: object
    PointCoverage:
      properties:
        critical_point_id:
          type: string
        detection_probability:
          type: number
        covered:
          type: boolean
      type: object
      required:
      - critical_point_id
      - detection_probability
      - covered
    Room:
      properties:
        id:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,47}$
        name:
          type: string
          maxLength: 80
          minLength: 1
        glb_node:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
        floor_y:
          type: number
          maximum: 50.0
          minimum: -50.0
        height:
          type: number
          maximum: 50.0
          exclusiveMinimum: 0.0
        min_xz:
          prefixItems:
          - type: number
            maximum: 50.0
            minimum: -50.0
          - type: number
            maximum: 50.0
            minimum: -50.0
          type: array
          maxItems: 2
          minItems: 2
        max_xz:
          prefixItems:
          - type: number
            maximum: 50.0
            minimum: -50.0
          - type: number
            maximum: 50.0
            minimum: -50.0
          type: array
          maxItems: 2
          minItems: 2
        visible_room_ids:
          items:
            type: string
            pattern: ^[a-z0-9][a-z0-9_-]{0,47}$
          type: array
          maxItems: 50
          description: Ambientes cujos pontos são visíveis por sensores instalados neste.
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - floor_y
      - height
      - min_xz
      - max_xz
    RunDetail:
      properties:
        id:
          type: string
          format: uuid
        home_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        created_by:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        layout_version:
          type: integer
        algorithm:
          type: string
          const: NSGA-II
          default: NSGA-II
        library:
          type: string
        population_size:
          type: integer
        generations:
          type: integer
        seed:
          type: integer
        evaluations:
          type: integer
        duration_ms:
          type: integer
        status:
          type: string
          enum:
          - completed
          - no_feasible_solution
        solution_count:
          type: integer
        layout:
          $ref: '#/components/schemas/HomeLayout'
        solutions:
          items:
            $ref: '#/components/schemas/Solution'
          type: array
      type: object
      required:
      - id
      - home_id
      - created_at
      - created_by
      - layout_version
      - library
      - population_size
      - generations
      - seed
      - evaluations
      - duration_ms
      - status
      - solution_count
      - layout
      - solutions
    RunSummary:
      properties:
        id:
          type: string
          format: uuid
        home_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        created_by:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        layout_version:
          type: integer
        algorithm:
          type: string
          const: NSGA-II
          default: NSGA-II
        library:
          type: string
        population_size:
          type: integer
        generations:
          type: integer
        seed:
          type: integer
        evaluations:
          type: integer
        duration_ms:
          type: integer
        status:
          type: string
          enum:
          - completed
          - no_feasible_solution
        solution_count:
          type: integer
      type: object
      required:
      - id
      - home_id
      - created_at
      - created_by
      - layout_version
      - library
      - population_size
      - generations
      - seed
      - evaluations
      - duration_ms
      - status
      - solution_count
    SaveLayoutRequest:
      properties:
        version:
          type: integer
          minimum: 0.0
          description: Versão lida antes da edição; use 0 para salvar pela primeira vez.
        layout:
          $ref: '#/components/schemas/HomeLayout'
      additionalProperties: false
      type: object
      required:
      - version
      - layout
    SensorPlacement:
      properties:
        candidate_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,47}$
        sensor_type_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,47}$
      additionalProperties: false
      type: object
      required:
      - candidate_id
      - sensor_type_id
    SensorType:
      properties:
        id:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,47}$
        name:
          type: string
          maxLength: 80
          minLength: 1
        unit_cost:
          anyOf:
          - type: number
            maximum: 10000000.0
            minimum: 0.0
          - type: 'null'
          description: Custo de aquisição por unidade. Obrigatório para avaliar ou otimizar.
        installation_cost:
          anyOf:
          - type: number
            maximum: 10000000.0
            minimum: 0.0
          - type: 'null'
          description: Custo de instalação por unidade. Obrigatório para avaliar ou otimizar.
        stock:
          type: integer
          maximum: 1000.0
          minimum: 0.0
          description: Quantidade disponível.
        range:
          type: number
          maximum: 50.0
          exclusiveMinimum: 0.0
          description: Alcance, em unidades da maquete.
        field_of_view_deg:
          type: number
          maximum: 360.0
          exclusiveMinimum: 0.0
          description: Abertura horizontal do campo de detecção; 360 = omnidirecional.
        reliability:
          type: number
          maximum: 1.0
          exclusiveMinimum: 0.0
          description: Probabilidade de detecção de um ponto dentro do alcance e do campo.
          default: 1.0
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - stock
      - range
      - field_of_view_deg
    Solution:
