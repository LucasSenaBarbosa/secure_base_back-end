                $ref: '#/components/schemas/RunDetail'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/homes/{home_id}/optimization-runs/{run_id}/solutions/{solution_id}:
    get:
