            - ADMIN_DELETION_FORBIDDEN
            - AUTHENTICATION_REQUIRED
            - BAD_REQUEST
            - CSRF_VALIDATION_FAILED
            - DATABASE_UNAVAILABLE
            - FORBIDDEN
