name: Backend CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: ruff check src tests
      - run: pytest

  migrations:
    name: Local migration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: v2.stable
      - name: Start local Supabase without logging generated credentials
        run: |
          log_file="$RUNNER_TEMP/supabase-start.log"
          if ! supabase start >"$log_file" 2>&1; then
            rm -f "$log_file"
            echo "::error::Supabase failed to start; CLI output was suppressed to protect generated local credentials."
            exit 1
          fi
          rm -f "$log_file"
      - run: supabase migration up --local
      - run: supabase db lint --local --fail-on error

  deploy-migrations:
    name: Deploy production migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - checks
      - migrations
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-supabase-migrations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: v2.stable
      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set +x
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_ID"
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Reject destructive pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +x
          if ! supabase migration list --linked --output-format json \
            > "$RUNNER_TEMP/migrations.json" 2> "$RUNNER_TEMP/migration-list.log"; then
            echo "::error::Could not read the linked migration history; CLI output was suppressed."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          ledger = json.loads(Path(os.environ["RUNNER_TEMP"], "migrations.json").read_text())
          unknown_remote = [
              migration.get("remote")
              for migration in ledger["migrations"]
              if migration.get("remote") and not migration.get("local")
          ]
          if unknown_remote:
              raise SystemExit(
                  "Remote migration history contains versions missing from this checkout; "
                  "deployment is blocked."
              )
          pending = [
              migration["local"]
              for migration in ledger["migrations"]
              if migration.get("local") and not migration.get("remote")
          ]
          forbidden = re.compile(
              r"\bDROP\b|\bTRUNCATE\b|\bDELETE\s+FROM\b|"
              r"\bEXECUTE\s+(?!ON\s+FUNCTION\b|FUNCTION\b)",
              re.IGNORECASE,
          )
          comment = re.compile(r"--[^\r\n]*|/\*.*?\*/", re.DOTALL)
          for version in pending:
              if not re.fullmatch(r"\d{14}", version):
                  raise SystemExit("The linked migration ledger contains an invalid version.")
              matches = list(Path("supabase/migrations").glob(f"{version}_*.sql"))
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one SQL file for pending migration {version}.")
              sql = comment.sub("", matches[0].read_text(encoding="utf-8"))
              if forbidden.search(sql):
                  raise SystemExit(
                      f"Pending migration {matches[0].name} contains a blocked destructive "
                      "or dynamic SQL operation. Review it and use the approved migration process."
                  )
          print(f"Safety check passed for {len(pending)} pending migration(s).")
          PY
      - name: Preview production migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +x
          supabase db push --linked --dry-run
      - name: Apply production migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +x
          supabase db push --linked --yes --skip-vault
