name: Backend CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: ruff check src tests
      - run: pytest

  migrations:
    name: Local migration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: v2.stable
      - name: Start local Supabase without logging generated credentials
        run: |
          log_file="$RUNNER_TEMP/supabase-start.log"
          if ! supabase start >"$log_file" 2>&1; then
            rm -f "$log_file"
            echo "::error::Supabase failed to start; CLI output was suppressed to protect generated local credentials."
            exit 1
          fi
          rm -f "$log_file"
      - run: supabase migration up --local
      - run: supabase db lint --local --fail-on error
